name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GNR_TEST_PG_HOST: 127.0.0.1
      GNR_TEST_PG_PORT: '5432'
      GNR_TEST_PG_USER: postgres
      GNR_TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PostgreSQL client tools and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 graphviz
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: python -m pip install -e '.[dev,postgresql,ui,queries]'
      - run: python -m pip check
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m build
      - name: Verify the installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[docs]'
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
