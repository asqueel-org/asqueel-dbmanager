name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GNR_TEST_PG_HOST: 127.0.0.1
      GNR_TEST_PG_PORT: '5432'
      GNR_TEST_PG_USER: postgres
      GNR_TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Install the coordinated engine revision
        # Replace with the published >=0.2,<0.3 constraint after the engine release.
        run: python -m pip install 'asqueel-migration[postgresql,validation] @ git+https://github.com/asqueel-org/asqueel-migration.git@a74f71b99c2b082f081f78c1671fd466cadc2d23'
      - run: python -m pip install -e '.[dev,postgresql]'
      - run: python -m pip check
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m build
      - name: Verify the installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          pytest -q
